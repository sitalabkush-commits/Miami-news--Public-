name: Update news
on:
  schedule:
    - cron: "*/30 * * * *"   # প্রতি ৩০ মিনিটে
  workflow_dispatch:          # হাতে চালানোর বাটন
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_LANG: Bengali
        run: python fetch_news.py
      - name: Commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "auto: update news"
          git push
